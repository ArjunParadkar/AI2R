[project]
name = "whiteboxtopo"
version = "0.1.0"
description = "The Riemannian theory of what a network knows: seven definitions, seven algorithms, one library."
requires-python = ">=3.12"
dependencies = [
  "numpy", "scipy", "scikit-learn", "networkx",
  "ripser", "persim", "matplotlib", "tqdm", "pandas",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whiteboxtopo*"]
