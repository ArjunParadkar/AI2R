[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whitebox-topo"
version = "0.0.1"
description = "Topological interpretability of neural-network training: persistent homology instruments (SV, TC, FPL, BiasTop) and calibrated signals built on them."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Arjun Paradkar"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "ripser>=0.6",
  "persim>=0.3",
]

[project.optional-dependencies]
fast = ["giotto-ph>=0.2"]
torch = ["torch>=2.0"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7", "giotto-ph>=0.2", "matplotlib>=3.7", "torch>=2.0"]

[tool.setuptools.packages.find]
include = ["whitebox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
